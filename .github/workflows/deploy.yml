name: Deploy Apigee Proxies Sequentially

on:
  push:
    branches:
      - '**'   # run on all branches

permissions:
  contents: read
  id-token: write

jobs:
  # -------------------
  # Deploy helloworld (dev)
  # -------------------
  deploy-helloworld:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ORG: ${{ vars.APIGEE_ORG }}
      ENV: test-env
      PROXY: helloworld
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.APIGEE_ORG }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.APIGEE_SERVICE_ACCOUNT }}
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/cloud-platform'
      - name: Zip Proxy
        run: |
          cd apiproxies/${PROXY}
          zip -r "../../${PROXY}.zip" apiproxy
      - name: Import Proxy
        run: |
          curl -X POST \
            "https://apigee.googleapis.com/v1/organizations/$ORG/apis?action=import&name=$PROXY" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@${PROXY}.zip" \
            -o import.json
          cat import.json
          REVISION=$(jq -r '.revision' import.json)
          if [ "$REVISION" = "null" ] || [ -z "$REVISION" ]; then
            echo "Import failed: no revision returned"
            exit 1
          fi
          echo "REVISION=$REVISION" >> $GITHUB_ENV
      - name: Deploy Proxy
        run: |
          curl --fail -X POST \
            "https://apigee.googleapis.com/v1/organizations/$ORG/environments/$ENV/apis/$PROXY/revisions/$REVISION/deployments?override=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}"

  validate-helloworld:
    if: github.ref != 'refs/heads/main'
    needs: deploy-helloworld
    uses: ./.github/workflows/validate-helloworld.yml

  # -------------------
  # Deploy helloworld2 (dev)
  # -------------------
  deploy-helloworld2:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: validate-helloworld
    env:
      ORG: ${{ vars.APIGEE_ORG }}
      ENV: test-env
      PROXY: helloworld2
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.APIGEE_ORG }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.APIGEE_SERVICE_ACCOUNT }}
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/cloud-platform'
      - name: Zip Proxy
        run: |
          cd apiproxies/${PROXY}
          zip -r "../../${PROXY}.zip" apiproxy
      - name: Import Proxy
        run: |
          curl -X POST \
            "https://apigee.googleapis.com/v1/organizations/$ORG/apis?action=import&name=$PROXY" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@${PROXY}.zip" \
            -o import.json
          REVISION=$(jq -r '.revision' import.json)
          if [ "$REVISION" = "null" ] || [ -z "$REVISION" ]; then
            echo "Import failed:"
            cat import.json
            exit 1
          fi
          echo "REVISION=$REVISION" >> $GITHUB_ENV
      - name: Deploy Proxy
        run: |
          curl --fail -X POST \
            "https://apigee.googleapis.com/v1/organizations/$ORG/environments/$ENV/apis/$PROXY/revisions/$REVISION/deployments?override=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}"

  validate-helloworld2:
    if: github.ref != 'refs/heads/main'
    needs: deploy-helloworld2
    uses: ./.github/workflows/validate-helloworld2.yml

  # -------------------
  # Deploy helloworld3 (prod)
  # -------------------
  deploy-helloworld3:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      ORG: ${{ vars.APIGEE_ORG }}
      ENV: test-xav
      PROXY: helloworld3
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate
        id: auth
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.APIGEE_ORG }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.APIGEE_SERVICE_ACCOUNT }}
          token_format: 'access_token'
          access_token_scopes: 'https://www.googleapis.com/auth/cloud-platform'
      - name: Zip Proxy
        run: |
          cd apiproxies/${PROXY}
          zip -r "../../${PROXY}.zip" apiproxy
      - name: Import Proxy
        run: |
          curl -X POST \
            "https://apigee.googleapis.com/v1/organizations/$ORG/apis?action=import&name=$PROXY" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}" \
            -H "Content-Type: multipart/form-data" \
            -F "file=@${PROXY}.zip" \
            -o import.json
          echo "REVISION=$(jq -r '.revision' import.json)" >> $GITHUB_ENV
      - name: Deploy Proxy
        run: |
          if [ -z "$REVISION" ] || [ "$REVISION" = "null" ]; then
            echo "No revision found, aborting"
            cat import.json
            exit 1
          fi
          curl --fail -X POST \
            "https://apigee.googleapis.com/v1/organizations/$ORG/environments/$ENV/apis/$PROXY/revisions/$REVISION/deployments?override=true" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.access_token }}"

  validate-helloworld3:
    if: github.ref == 'refs/heads/main'
    needs: deploy-helloworld3
    uses: ./.github/workflows/validate-helloworld3.yml
